name: Caiguale TV - ARM64 Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caiguale-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false
      CAIGUALE_BUILD_TIME: ${{ github.sha }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Validate source exists
        shell: bash
        run: |
          test -f gradlew || { echo "Android source has not been uploaded yet"; exit 1; }
          test -f settings.gradle
          test -f app/build.gradle
          test -f gradle/wrapper/gradle-wrapper.jar
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          sdkmanager --install 'platforms;android-37' 'build-tools;37.0.0' 'build-tools;36.0.0'
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Set up Python 3.10 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          java -version
          python3.10 --version
          node --check app/src/main/assets/caiguale/app.js
          test -f app/src/mpvlibs-arm64/assets/mpv-libs/arm64-v8a/libmpv.so
          test -f chaquo/requirements.txt
      - name: Build ARM64 Full TV Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --no-parallel --max-workers=2 \
            --no-build-cache --stacktrace --console=plain \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            :app:assembleLeanbackFullArm64_v8aDebug \
            2>&1 | tee caiguale-gradle.log
      - name: Verify APK
        if: success()
        run: python3 ci/verify_caiguale_apk.py
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: caiguale-tv-arm64-debug
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.json
            ci-build-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caiguale-build-log
          path: |
            caiguale-gradle.log
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 14
